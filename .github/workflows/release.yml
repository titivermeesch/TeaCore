name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write     # upload release assets
  packages: write     # publish to GitHub Packages

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve version from tag
        id: version
        run: |
          # Strip the leading "v" from the tag (v0.1.0 -> 0.1.0).
          ref=${GITHUB_REF_NAME}
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"

      - name: Build against lowest supported Spigot API (for publishing)
        run: ./gradlew -PteacoreVersion=${{ steps.version.outputs.version }} build --stacktrace

      - name: Publish to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew -PteacoreVersion=${{ steps.version.outputs.version }} publish --stacktrace

      - name: Create GitHub Release with shadow jar
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/teacore-${{ steps.version.outputs.version }}-all.jar
          generate_release_notes: true
