name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Build against the lowest supported Spigot API (the Java 21 floor) and
        # against a recent release, so we catch both regressions on old servers
        # and breakage from API changes on the latest server.
        spigot:
          - '1.20.5-R0.1-SNAPSHOT'
          - '1.21.4-R0.1-SNAPSHOT'
    name: build (spigot ${{ matrix.spigot }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew -PspigotApiVersion=${{ matrix.spigot }} build --stacktrace
