name: TeaCore
version: '${version}'
main: me.playbosswar.tea.core.impl.TeaCorePlugin
api-version: '1.20'
author: playbosswar
description: Shared engine for Tea minigames.
load: STARTUP
depend: [Vault]
softdepend: [WorldEdit, FastAsyncWorldEdit, PlaceholderAPI]

commands:
  tea:
    description: TeaCore administration commands
    aliases: [teacore]
    permission: tea.admin
    usage: /tea <reload|version|help|arena|game|map>
  chat:
    description: Switch your active chat channel
    aliases: [ch]
    permission: tea.chat.use
    usage: /chat <match|team|staff|global>
  kit:
    description: Open the kit picker or select a kit
    permission: tea.kit
    usage: /kit [game] [kitId]
  leave:
    description: Leave your current arena, or drop out of the matchmaker queue
    permission: tea.arena.play
    usage: /leave
  stats:
    description: Open the stats viewer GUI; admins can pass a player name
    permission: tea.stats
    usage: /stats [player]
  profile:
    description: Open your profile (stats, achievements, history, kits)
    permission: tea.menu
    usage: /profile
  menu:
    description: Open a menu by id (admins can open one for another player)
    permission: tea.menu
    usage: /menu <id> [player]
  board:
    description: Show or hide your sidebar
    aliases: [sidebar]
    permission: tea.board
    usage: /board
  play:
    description: Queue for a game, optionally filtering by map (lobby feature)
    permission: tea.lobby.play
    usage: /play <game> [map]

permissions:
  tea.admin:
    description: Full TeaCore admin access
    default: op
    children:
      tea.reload: true
      tea.version: true
      tea.arena.admin: true
      tea.arena.play: true
      tea.chat.use: true
      tea.chat.staff: true
      tea.chat.global: true
      tea.map.admin: true
      tea.stats: true
  tea.reload:
    description: Reload TeaCore config, theme, and locale bundles
    default: op
  tea.version:
    description: View TeaCore version
    default: true
  tea.arena.admin:
    description: Allocate and release arenas
    default: op
  tea.arena.play:
    description: Join, spectate, leave arenas via /tea arena join|spectate|observe|leave
    default: true
  tea.chat.use:
    description: Use /chat to switch the active chat channel (match/team by default)
    default: true
  tea.chat.staff:
    description: Send and receive messages on the staff chat channel
    default: op
  tea.chat.global:
    description: Send messages on the global chat channel
    default: op
  tea.map.admin:
    description: Create, edit, and delete map definitions via /tea map
    default: op
  tea.kit:
    description: Open the kit picker or select a kit via /kit
    default: true
  tea.stats:
    description: View your own stats via /tea stats (admins with tea.admin can view other players)
    default: true
  tea.menu:
    description: Use /menu to open menus (a menu file can require its own permission)
    default: true
  tea.menu.others:
    description: Open a menu for another player with /menu <id> <player>
    default: op
  tea.board:
    description: Toggle your own sidebar with /board
    default: true
  tea.lobby.play:
    description: Queue for a game from the lobby via /play
    default: true
  tea.lobby.admin:
    description: Manage lobby connection signs, lobby spawn, and lobby config via /tea lobby
    default: op
