# Ranked leaderboard of one game (argument: game), opened with /leaderboard
# <game>. Per player: {rank} {player} {uuid} {rating} {games} {wins} {losses}.
# Menu values: {game} {game_name}.
enabled: true
title: "<primary>Top {game_name}"
rows: 6
pattern:
  - "LLLLLLLLL"
  - "LLLLLLLLL"
  - "LLLLLLLLL"
  - "LLLLLLLLL"
  - "LLLLLLLLL"
  - "B##<#>##X"
items:
  '#': { material: GRAY_STAINED_GLASS_PANE, name: " " }
  '<': { material: ARROW, name: "<secondary>Previous page", action: previous-page }
  '>': { material: ARROW, name: "<secondary>Next page <muted>({page}/{pages})", action: next-page }
  'B': { material: ARROW, name: "<secondary>Back", action: back }
  'X': { material: BARRIER, name: "<error>Close", action: close }
lists:
  'L':
    source: leaderboard
    item:
      material: PLAYER_HEAD
      skull-owner: "{player}"
      name: "<accent>#{rank}</accent> <highlight>{player}"
      lore:
        - "<secondary>Rating: <highlight>{rating}"
        - "<secondary>Wins: <highlight>{wins}</highlight> <muted>/</muted> Losses: <highlight>{losses}"
        - "<secondary>Ranked games: <highlight>{games}"
      action: none
    empty: { material: BARRIER, name: "<muted>Nobody has played ranked yet" }
