# The entries of a list or map setting, such as kits or quests (arguments:
# file, path). Per entry: {file} {path} {kind} (entry, add or inventory)
# {title} {info} {controls}.
enabled: true
permission: tea.settings
title: "<primary>Settings"
rows: 6
pattern:
  - "EEEEEEEEE"
  - "EEEEEEEEE"
  - "EEEEEEEEE"
  - "EEEEEEEEE"
  - "EEEEEEEEE"
  - "B##<#>##X"
items:
  '#': { material: GRAY_STAINED_GLASS_PANE, name: " " }
  '<': { material: ARROW, name: "<secondary>Previous page", action: previous-page }
  '>': { material: ARROW, name: "<secondary>Next page <muted>({page}/{pages})", action: next-page }
  'B': { material: ARROW, name: "<secondary>Back", action: "settings-up:{file}|{path}" }
  'X': { material: BARRIER, name: "<error>Close", action: close }
lists:
  'E':
    source: settings-entries
    item:
      name: "<primary>{title}"
      lore:
        - "<secondary>{info}"
        - ""
        - "<success>{controls}"
      actions: ["settings-entry:{file}|{path}|{kind}", "sound:UI_BUTTON_CLICK"]
    empty: { material: BARRIER, name: "<muted>Empty" }
