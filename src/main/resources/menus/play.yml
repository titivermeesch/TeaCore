# Game selector. Opened by /play (no arguments) and the lobby compass.
# Per game: {game_id} {game_name} {players} {arenas} {open_arenas} {queue} {maps}
enabled: true
title: "<primary>Play"
rows: 4
refresh-ticks: 20
pattern:
  - "#########"
  - "#GGGGGGG#"
  - "#GGGGGGG#"
  - "##<#P#>X#"
items:
  '#': { material: GRAY_STAINED_GLASS_PANE, name: " " }
  '<': { material: ARROW, name: "<secondary>Previous page", action: previous-page }
  '>': { material: ARROW, name: "<secondary>Next page <muted>({page}/{pages})", action: next-page }
  'P': { material: PLAYER_HEAD, skull-owner: "{player}", name: "<primary>Your profile", lore: ["<muted>Stats, achievements, history"], action: "open-menu:profile" }
  'X': { material: BARRIER, name: "<error>Close", action: close }
lists:
  'G':
    source: games
    item:
      name: "<primary><bold>{game_name}"
      lore:
        - "<secondary>Playing: <highlight>{players}"
        - "<secondary>Open arenas: <highlight>{open_arenas}"
        - "<secondary>Maps: <highlight>{maps}"
        - ""
        - "<success>Left-click to play"
        - "<muted>Right-click to choose a map"
      left-actions: ["play:{game_id}", "sound:UI_BUTTON_CLICK"]
      right-actions: ["open-menu:play-maps game={game_id}"]
    empty: { material: BARRIER, name: "<muted>No games are running" }
