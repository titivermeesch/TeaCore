# Players of one arena (argument: arena), participants first. Per player, on
# top of the arena values: {player} (uuid) {name} {team} {spectator} {role}
enabled: true
permission: tea.arena.admin
title: "<primary>Arena players"
rows: 6
refresh-ticks: 20
pattern:
  - "PPPPPPPPP"
  - "PPPPPPPPP"
  - "PPPPPPPPP"
  - "PPPPPPPPP"
  - "PPPPPPPPP"
  - "B##<#>##X"
items:
  '#': { material: GRAY_STAINED_GLASS_PANE, name: " " }
  '<': { material: ARROW, name: "<secondary>Previous page", action: previous-page }
  '>': { material: ARROW, name: "<secondary>Next page <muted>({page}/{pages})", action: next-page }
  'B': { material: ARROW, name: "<secondary>Back", action: back }
  'X': { material: BARRIER, name: "<error>Close", action: close }
lists:
  'P':
    source: admin-players
    item:
      name: "<primary>{name}"
      skull-owner: "{name}"
      lore:
        - "<secondary>{role} <muted>team: {team}"
        - ""
        - "<error>Left-click: kick to the lobby"
        - "<secondary>Right-click: move to another arena"
        - "<secondary>Shift-left: make spectator"
        - "<secondary>Shift-right: teleport to them"
      left-actions: ["confirm:Kick {name}?|admin-kick:{arena} {player}"]
      right-actions: ["open-menu:admin-move arena={arena} player={player}"]
      shift-left-actions: ["confirm:Make {name} a spectator?|admin-spectator:{arena} {player}"]
      shift-right-actions: ["admin-tp:{arena} {player}"]
    empty: { material: BARRIER, name: "<muted>Nobody in this arena" }
