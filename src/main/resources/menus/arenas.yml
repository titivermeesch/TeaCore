# Live arenas of a game (arguments: game, optional map). Refreshes every second.
# Per arena: {arena_id} (short) {arena_uuid} (full) {game} {game_name} {map_id} {map_name} {state}
# {players} {max} {server} {joinable}
enabled: true
title: "<primary>Arenas"
rows: 5
refresh-ticks: 20
pattern:
  - "#########"
  - "#AAAAAAA#"
  - "#AAAAAAA#"
  - "#AAAAAAA#"
  - "B##<#>##X"
items:
  '#': { material: GRAY_STAINED_GLASS_PANE, name: " " }
  '<': { material: ARROW, name: "<secondary>Previous page", action: previous-page }
  '>': { material: ARROW, name: "<secondary>Next page <muted>({page}/{pages})", action: next-page }
  'B': { material: ARROW, name: "<secondary>Back", action: back }
  'X': { material: BARRIER, name: "<error>Close", action: close }
lists:
  'A':
    source: arenas
    item:
      name: "<primary>{map_name} <muted>#{arena_id}"
      lore:
        - "<secondary>State: <highlight>{state}"
        - "<secondary>Players: <highlight>{players}/{max}"
        - "<secondary>Server: <muted>{server}"
        - ""
        - "<success>Left-click to join"
        - "<muted>Right-click to spectate"
      left-actions: ["join-arena:{arena_uuid}"]
      right-actions: ["spectate:{arena_uuid}"]
    empty: { material: BARRIER, name: "<muted>No arenas right now" }
