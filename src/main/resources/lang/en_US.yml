core:
  history:
    win: "<success>Win</success>"
    loss: "<error>Loss</error>"
    draw: "<warning>Draw</warning>"
  achievements:
    unlocked: "<success>Unlocked</success>"
    locked: "<muted>Locked</muted>"
  menu:
    usage: "<secondary>Usage:</secondary> <accent>/menu <id> [player]</accent>"
    unknown: "<error>No menu called <id>, or it is turned off.</error>"
    no-permission: "<error>You can't open that menu.</error>"
    player-offline: "<error><player> is not online.</error>"
  board:
    hidden: "<secondary>Sidebar hidden.</secondary> <muted>Type</muted> <accent>/board</accent> <muted>to show it again.</muted>"
    shown: "<success>Sidebar shown.</success>"
  reload:
    success: "<success>Configuration reloaded.</success>"
    failed: "<error>Reload failed: <reason></error>"
  version:
    line: "<primary>TeaCore</primary> <muted>v</muted><highlight><version></highlight>"
  achievement:
    title: "<accent><bold>Achievement Unlocked!</bold></accent>"
    chat: "<accent>Achievement unlocked: <highlight><name></highlight></accent>"
  command:
    no-permission: "<error>You don't have permission to use that.</error>"
    unknown: "<error>Unknown subcommand. Try </error><accent>/tea help</accent><error>.</error>"
    player-only: "<error>This command can only be run by a player.</error>"
    lobby-disabled: "<error>Lobby features are disabled on this server.</error> <muted>Set </muted><accent>lobby.enabled: true</accent><muted> in </muted><accent>plugins/TeaCore/config.yml</accent><muted> and restart.</muted>"
  help:
    header: "<primary><bold>TeaCore commands</bold></primary>"
    entry: "<accent>/tea <cmd></accent> <muted>-</muted> <secondary><desc></secondary>"
    reload: "<accent>/tea reload</accent> <muted>-</muted> <secondary>Reload config, theme, and locale bundles</secondary>"
    version: "<accent>/tea version</accent> <muted>-</muted> <secondary>Show the running TeaCore version</secondary>"
    arena: "<accent>/tea arena</accent> <muted>-</muted> <secondary>Manage arenas (run it to list subcommands)</secondary>"
    game: "<accent>/tea game list</accent> <muted>-</muted> <secondary>Show registered games</secondary>"
    map: "<accent>/tea map</accent> <muted>-</muted> <secondary>Create and edit arena maps</secondary>"
    stats: "<accent>/tea stats [player]</accent> <muted>-</muted> <secondary>Show stats for a player across all games</secondary>"
    hint-arena: "<muted>Type </muted><accent>/tea arena</accent><muted> for the full arena subcommand list.</muted>"
  boot:
    ready: "<success>TeaCore online.</success>"
  countdown:
    title: "<accent><seconds></accent>"
    subtitle: "<secondary>Starting...</secondary>"
    chat: "<primary>Game starts in</primary> <accent><seconds>s</accent>"
    go:
      title: "<success><bold>GO!</bold></success>"
      subtitle: ""
    abort:
      title: "<warning><bold>Countdown aborted</bold></warning>"
      subtitle: "<secondary>Waiting for more players</secondary>"
  arena:
    usage: "<secondary>Usage:</secondary> <accent>/tea arena <list|allocate|join|spectate|leave|release></accent>"
    not-found: "<error>No arena matches </error><accent><id></accent><error>.</error>"
    help:
      header: "<primary><bold>Arena subcommands</bold></primary>"
      list: "<accent>/tea arena list</accent> <muted>-</muted> <secondary>Show every allocated arena with state and player count</secondary>"
      allocate: "<accent>/tea arena allocate <game> [map]</accent> <muted>-</muted> <secondary>Allocate a new arena for a game (admin)</secondary>"
      join: "<accent>/tea arena join <arenaId></accent> <muted>-</muted> <secondary>Join a specific arena as a player</secondary>"
      spectate: "<accent>/tea arena spectate <arenaId></accent> <muted>-</muted> <secondary>Join a specific arena as a spectator</secondary>"
      observe: "<accent>/tea arena observe <arenaId></accent> <muted>-</muted> <secondary>Teleport into an arena world without becoming a participant (admin)</secondary>"
      leave: "<accent>/tea arena leave</accent> <muted>-</muted> <secondary>Leave the arena you are currently in</secondary>"
      release: "<accent>/tea arena release <arenaId></accent> <muted>-</muted> <secondary>Destroy an arena and evacuate its occupants (admin)</secondary>"
      start: "<accent>/tea arena start <arenaId></accent> <muted>-</muted> <secondary>Force the next lifecycle transition immediately (admin)</secondary>"
    list:
      header: "<primary><bold>Arenas</bold></primary>"
      empty: "<muted>(no arenas allocated)</muted>"
      entry: "<accent><id></accent> <muted>@</muted><secondary><server></secondary> <muted>-</muted> <secondary><game></secondary> <muted>map=</muted><highlight><map></highlight> <muted>state=</muted><primary><state></primary> <muted>(</muted><players><muted>/</muted><max><muted>)</muted>"
    allocate:
      usage: "<secondary>Usage:</secondary> <accent>/tea arena allocate <game> [map]</accent>"
      success: "<success>Allocated arena</success> <accent><id></accent> <muted>for</muted> <primary><game></primary> <muted>(map=</muted><map><muted>)</muted>"
      failed: "<error>Allocation failed: <reason></error>"
    join:
      usage: "<secondary>Usage:</secondary> <accent>/tea arena join <arenaId></accent>"
      success: "<success>Joined arena</success> <accent><id></accent>"
      failed: "<error>Could not join arena (full or unavailable).</error>"
    leave:
      success: "<success>You left the arena.</success>"
      not-in-arena: "<warning>You are not in an arena.</warning>"
    observe:
      usage: "<secondary>Usage:</secondary> <accent>/tea arena observe <arenaId></accent>"
      success: "<success>Observing arena</success> <accent><id></accent><muted>. Type </muted><accent>/tea arena leave</accent><muted> or teleport elsewhere to exit.</muted>"
    release:
      usage: "<secondary>Usage:</secondary> <accent>/tea arena release <arenaId></accent>"
      success: "<success>Released arena</success> <accent><id></accent>"
    start:
      usage: "<secondary>Usage:</secondary> <accent>/tea arena start <arenaId></accent>"
      done: "<success>Arena</success> <accent><id></accent> <success>skipped to the next phase.</success>"
  queue:
    bossbar: "<accent>Queued:</accent> <primary><game></primary> <muted>-</muted> #<position><muted>/</muted><total>"
  map:
    usage: "<secondary>Run </secondary><accent>/tea map help</accent><secondary> for the full subcommand list.</secondary>"
    help:
      header: "<primary><bold>Map subcommands</bold></primary>"
      create: "<accent>/tea map create <game> <map></accent> <muted>-</muted> <secondary>Open a fresh edit world for a new map</secondary>"
      edit: "<accent>/tea map edit <game> <map></accent> <muted>-</muted> <secondary>Re-open an existing map in an edit world</secondary>"
      pos1: "<accent>/tea map pos1</accent> <muted>-</muted> <secondary>Mark the first build-region corner at your feet</secondary>"
      pos2: "<accent>/tea map pos2</accent> <muted>-</muted> <secondary>Mark the opposite build-region corner</secondary>"
      waiting: "<accent>/tea map waiting</accent> <muted>-</muted> <secondary>Set the pre-match waiting spawn at your location</secondary>"
      addspawn: "<accent>/tea map addspawn</accent> <muted>-</muted> <secondary>Add a participant spawn at your location</secondary>"
      clearspawns: "<accent>/tea map clearspawns</accent> <muted>-</muted> <secondary>Remove every participant spawn from the draft</secondary>"
      displayname: "<accent>/tea map displayname [name...]</accent> <muted>-</muted> <secondary>Set (or, with no args, clear) the human-readable map name</secondary>"
      min: "<accent>/tea map min <number></accent> <muted>-</muted> <secondary>Set the minimum participant count to start a match</secondary>"
      max: "<accent>/tea map max <number></accent> <muted>-</muted> <secondary>Set the participant cap</secondary>"
      removeextension: "<accent>/tea map removeextension <id></accent> <muted>-</muted> <secondary>Drop a game-contributed extension value from the draft</secondary>"
      status: "<accent>/tea map status</accent> <muted>-</muted> <secondary>Show what's set on the draft and what's still required</secondary>"
      board: "<accent>/tea map board</accent> <muted>-</muted> <secondary>Toggle the map-setup sidebar on or off</secondary>"
      save: "<accent>/tea map save</accent> <muted>-</muted> <secondary>Save the draft and tear down the edit world</secondary>"
      discard: "<accent>/tea map discard</accent> <muted>-</muted> <secondary>Drop the draft without saving</secondary>"
      list: "<accent>/tea map list [game]</accent> <muted>-</muted> <secondary>List registered maps</secondary>"
      info: "<accent>/tea map info <game> <map></accent> <muted>-</muted> <secondary>Show details for a saved map</secondary>"
      reload: "<accent>/tea map reload</accent> <muted>-</muted> <secondary>Re-read every map yaml from disk</secondary>"
      delete: "<accent>/tea map delete <game> <map></accent> <muted>-</muted> <secondary>Permanently delete a saved map and its schematic</secondary>"
      hint-extensions: "<muted>Game plugins may add their own subcommands; run </muted><accent>/tea map status</accent><muted> to see required ones.</muted>"
    displayname:
      set: "<success>Display name for</success> <accent><map></accent> <success>set to</success> <highlight><name></highlight>"
      cleared: "<warning>Display name for</warning> <accent><map></accent> <warning>cleared - falls back to the map id.</warning>"
    no-active-draft: "<error>No active draft. Run </error><accent>/tea map create <game> <map></accent><error> or </error><accent>/tea map edit <game> <map></accent><error>.</error>"
    not-in-edit-world: "<error>Return to your edit world first: </error><accent><world></accent>"
    create:
      usage: "<secondary>Usage:</secondary> <accent>/tea map create <game> <map></accent>"
      started: "<success>Created edit world</success> <accent><world></accent> <muted>for</muted> <primary><game>/<map></primary><muted>. Paste or build your map, then set pos1/pos2 and spawns.</muted>"
      failed: "<error>Create failed: <reason></error>"
    edit:
      usage: "<secondary>Usage:</secondary> <accent>/tea map edit <game> <map></accent>"
      started: "<success>Editing map</success> <accent><game>/<map></accent> <muted>in</muted> <accent><world></accent> <muted>(</muted><spawns><muted> spawns)</muted>"
      failed: "<error>Edit failed: <reason></error>"
    pos1:
      set: "<success>pos1 set at</success> <highlight><x></highlight><muted>,</muted><highlight><y></highlight><muted>,</muted><highlight><z></highlight>"
    pos2:
      set: "<success>pos2 set at</success> <highlight><x></highlight><muted>,</muted><highlight><y></highlight><muted>,</muted><highlight><z></highlight>"
    waiting:
      set: "<success>Waiting spawn set at</success> <highlight><x></highlight><muted>,</muted><highlight><y></highlight><muted>,</muted><highlight><z></highlight>"
    addspawn:
      added: "<success>Added spawn</success> <accent><id></accent> <muted>at</muted> <highlight><x></highlight><muted>,</muted><highlight><y></highlight><muted>,</muted><highlight><z></highlight> <muted>(total:</muted> <count><muted>)</muted>"
    clearspawns:
      done: "<warning>Cleared <count> participant spawn(s).</warning>"
    extension:
      set: "<success>Updated</success> <accent><id></accent>"
      failed: "<error>Extension</error> <accent><id></accent> <error>failed: <reason></error>"
    removeextension:
      usage: "<secondary>Usage:</secondary> <accent>/tea map removeextension <id-or-subcommand></accent>"
      done: "<warning>Removed extension</warning> <accent><id></accent>"
      missing: "<warning>No extension set for</warning> <accent><id></accent>"
    status:
      header: "<primary><bold>Draft status</bold></primary> <muted>-</muted> <accent><game>/<map></accent>"
      entry-set: "<success>✓</success> <secondary><field>:</secondary> <highlight><value></highlight>"
      entry-missing: "<error>!</error> <error><field>:</error> <muted>(not set)</muted>"
      entry-optional: "<muted>- </muted><muted><field>: (optional, not set)</muted>"
      ready: "<success>✓ All set. You can </success><accent>/tea map save</accent><success>.</success>"
      missing-header: "<warning><bold>Cannot save yet.</bold></warning> <warning>Fix these:</warning>"
      missing:
        pos1: "<error>!</error> <secondary>pos1 - stand in one corner of the build area and run </secondary><accent>/tea map pos1</accent>"
        pos2: "<error>!</error> <secondary>pos2 - stand in the opposite corner and run </secondary><accent>/tea map pos2</accent>"
        participant-spawns: "<error>!</error> <secondary>at least one participant spawn - stand where each player starts and run </secondary><accent>/tea map addspawn</accent>"
        waiting-spawn: "<error>!</error> <secondary>waiting spawn - stand where players wait pre-match and run </secondary><accent>/tea map waiting</accent>"
        extension: "<error>!</error> <secondary>required extension </secondary><accent><id></accent><secondary> - run </secondary><accent>/tea map <subcommand></accent>"
        no-active-draft: "<error>!</error> <secondary>no active draft. Start with </secondary><accent>/tea map create</accent><secondary> or </secondary><accent>/tea map edit</accent>"
    board:
      shown: "<success>Map-setup sidebar shown.</success> <muted>Toggle it off with </muted><accent>/tea map board</accent><muted>.</muted>"
      hidden: "<warning>Map-setup sidebar hidden.</warning> <muted>Toggle it back with </muted><accent>/tea map board</accent><muted>.</muted>"
      disabled: "<error>The map-setup sidebar is disabled on this server (</error><accent>map-setup-scoreboard.enabled</accent><error>).</error>"
    scoreboard:
      # Objective title shown at the top of the sidebar.
      title: "<primary><bold>Map Setup</bold></primary>"
      # Context line under the title (which map is being authored).
      context: "<accent><game></accent><muted>/</muted><accent><map></accent>"
      # Footer when there are more incomplete steps than fit in the window.
      more: "<muted>+<count> more step(s) left</muted>"
      # Shown once every required step is set.
      ready: "<success>✓ Ready! Run /tea map save</success>"
      step:
        pos1:
          label: "<secondary>» Set build corner 1</secondary>"
          hint: "<accent>/tea map pos1</accent>"
        pos2:
          label: "<secondary>» Set build corner 2</secondary>"
          hint: "<accent>/tea map pos2</accent>"
        waiting-spawn:
          label: "<secondary>» Set waiting spawn</secondary>"
          hint: "<accent>/tea map waiting</accent>"
        participant-spawns:
          label: "<secondary>» Add participant spawns</secondary>"
          hint: "<accent>/tea map addspawn</accent>"
        # Required game-contributed extensions; <label> and <subcommand> come
        # from the registering game's MapExtension.
        extension:
          label: "<secondary>» <label></secondary>"
          hint: "<accent>/tea map <subcommand></accent>"
    min:
      usage: "<secondary>Usage:</secondary> <accent>/tea map min <number></accent>"
      set: "<success>Player bounds:</success> <accent><min></accent><muted>-</muted><accent><max></accent>"
    max:
      usage: "<secondary>Usage:</secondary> <accent>/tea map max <number></accent>"
      set: "<success>Player bounds:</success> <accent><min></accent><muted>-</muted><accent><max></accent>"
    save:
      success: "<success>✓ Saved map</success> <accent><game>/<map></accent> <muted>(</muted><spawns><muted> spawns)</muted>"
      failed: "<error>! Save failed:</error> <muted><reason></muted>"
      no-spawns: "<error>! Add at least one participant spawn with </error><accent>/tea map addspawn</accent><error>.</error>"
      missing-header: "<warning><bold>Cannot save yet.</bold></warning> <warning>Fix these:</warning>"
    discard:
      done: "<warning>Discarded draft.</warning>"
      none: "<warning>No active draft to discard.</warning>"
    list:
      header: "<primary><bold>Registered maps</bold></primary>"
      empty: "<muted>(no maps registered)</muted>"
      entry: "<accent><game>/<map></accent> <muted>(</muted><spawns><muted> spawns,</muted> <min><muted>-</muted><max> <muted>players)</muted>"
    info:
      usage: "<secondary>Usage:</secondary> <accent>/tea map info <game> <map></accent>"
      not-found: "<error>Map not found: </error><accent><game>/<map></accent>"
      header: "<primary><bold>Map</bold></primary> <accent><game>/<map></accent>"
      display-name: "<muted>display name:</muted> <highlight><name></highlight>"
      schematic: "<muted>schematic:</muted> <highlight><file></highlight>"
      waiting: "<muted>waiting spawn:</muted> <highlight><waiting></highlight>"
      spawns: "<muted>participant spawns:</muted> <highlight><count></highlight>"
      players: "<muted>players:</muted> <highlight><min></highlight><muted>-</muted><highlight><max></highlight>"
    reload:
      done: "<success>Reloaded maps:</success> <muted>was</muted> <highlight><before></highlight><muted>, now</muted> <highlight><after></highlight>"
    delete:
      usage: "<secondary>Usage:</secondary> <accent>/tea map delete <game> <map></accent>"
      done: "<success>Deleted map</success> <accent><game>/<map></accent>"
      failed: "<error>Delete failed: <reason></error>"
  kit-picker:
    usage: "<secondary>Usage:</secondary> <accent>/kit [game] [kitId]</accent><muted>. Run inside an arena to auto-fill the game.</muted>"
    title: "Select kit: <game>"
    selected: "<success>Selected kit</success> <accent><kit></accent> <muted>for</muted> <primary><game></primary>"
    unknown: "<error>Unknown kit </error><accent><kit></accent><error> for </error><primary><game></primary><error>.</error>"
    none: "<warning>No kits registered for </warning><primary><game></primary><warning>.</warning>"
    cost: "<muted>Cost:</muted> <highlight><cost></highlight>"
    cost-unlocked: "<muted>Cost:</muted> <success><cost></success> <muted>(owned)</muted>"
    cost-insufficient: "<error>Cost:</error> <highlight><cost></highlight> <error>(you have <balance>)</error>"
    locked-prefix: "<error>[LOCKED]</error> <name>"
    purchased: "<success>Purchased kit</success> <accent><kit></accent> <muted>for</muted> <highlight><cost></highlight>"
    insufficient: "<error>Insufficient balance.</error> <muted>Cost:</muted> <highlight><cost></highlight><muted>, you have</muted> <highlight><balance></highlight>"
    economy-unavailable: "<error>Economy is unavailable. No Vault provider is registered.</error>"
    withdraw-failed: "<error>Could not complete purchase (withdraw failed).</error>"
    unlock-failed: "<error>Could not record unlock. You have been refunded.</error>"
  chat:
    usage: "<secondary>Usage:</secondary> <accent>/chat <match|team|staff|global></accent>"
    unknown-channel: "<error>Unknown channel </error><accent><channel></accent><error>.</error>"
    active-channel: "<success>Active chat channel:</success> <accent><channel></accent>"
  leave:
    success: "<success>You left the arena.</success>"
    dequeued: "<success>Dropped out of the matchmaker queue.</success>"
    nothing-to-leave: "<warning>You're not in an arena or a queue.</warning>"
  stats:
    usage: "<secondary>Usage:</secondary> <accent>/tea stats [player]</accent>"
    header: "<primary><bold>Stats for <player></bold></primary>"
    game: "<accent><game></accent>"
    entry: "<secondary>  <label></secondary><muted>:</muted> <highlight><value></highlight>"
    empty: "<secondary>(no stats recorded)</secondary>"
    gui:
      title: "<player>'s stats"
      summary:
        name: "<primary><bold><player></bold></primary>"
        lore: "<secondary>Tracked in <highlight><with></highlight><secondary>/</secondary><highlight><total></highlight> <secondary>games.</secondary>"
      game:
        name: "<accent><bold><game></bold></accent>"
        entry: "<secondary><label></secondary><muted>:</muted> <highlight><value></highlight>"
        empty: "<secondary>No stats recorded yet.</secondary>"
      close: "<error>Close</error>"
  game:
    list:
      header: "<primary><bold>Registered games</bold></primary>"
      empty: "<muted>(no games registered)</muted>"
      entry: "<accent><id></accent> <muted>maps=</muted><maps> <muted>teams=</muted><primary><teams></primary>"
lobby:
  play:
    usage: "<secondary>Usage:</secondary> <accent>/play <game> [map]</accent>"
    unknown-game: "<error>Unknown game </error><accent><game></accent><error>. Try </error><accent>/tea game list</accent><error>.</error>"
    joined: "<success>Joined</success> <primary><game></primary> <muted>on arena</muted> <accent><arena></accent> <muted>(map=</muted><highlight><map></highlight><muted>)</muted>"
    join-failed: "<error>Could not join <game>. Arena may be full or already starting.</error>"
    allocation-failed: "<error>Allocation failed: <reason></error>"
    queued: "<success>Queued for</success> <primary><game></primary> <muted>(map:</muted> <accent><map></accent><muted>). Searching for an arena...</muted>"
  sign:
    line1: "<yellow><bold><game></bold></yellow>"
    line2: "<gray><map></gray>"
    line3: "<aqua>>> Click to Join <<</aqua>"
    line4: "<green><players> players</green>"
  admin:
    usage: "<secondary>Usage:</secondary> <accent>/tea lobby <sign|spawn|config|reload></accent>"
    reload:
      done: "<success>Reloaded lobby config and <count> connection sign(s).</success>"
    sign:
      usage: "<secondary>Usage:</secondary> <accent>/tea lobby sign <bind|unbind|list></accent>"
      not-looking-at-sign: "<error>Look at a placed sign (within 6 blocks) and try again.</error>"
      bind:
        usage: "<secondary>Usage:</secondary> <accent>/tea lobby sign bind <game> [map]</accent>"
        done: "<success>Bound sign at</success> <highlight><x></highlight><muted>,</muted><highlight><y></highlight><muted>,</muted><highlight><z></highlight> <muted>to</muted> <primary><game></primary> <muted>(map=</muted><accent><map></accent><muted>)</muted>"
      unbind:
        done: "<success>Unbound sign.</success>"
        not-bound: "<warning>That sign is not bound.</warning>"
        auto: "<success>Sign was bound - unbound automatically.</success>"
      list:
        header: "<primary><bold>Connection signs</bold></primary>"
        empty: "<muted>(no signs bound)</muted>"
        entry: "<accent><world></accent> <muted>@</muted> <highlight><x></highlight><muted>,</muted><highlight><y></highlight><muted>,</muted><highlight><z></highlight> <muted>-></muted> <primary><game></primary><muted>/</muted><accent><map></accent>"
    spawn:
      usage: "<secondary>Usage:</secondary> <accent>/tea lobby spawn <set|tp></accent>"
      not-set: "<warning>No lobby spawn is configured. Stand where you want it and run </warning><accent>/tea lobby spawn set</accent><warning>.</warning>"
      set:
        done: "<success>Lobby spawn set to</success> <accent><world></accent> <muted>@</muted> <highlight><x></highlight><muted>,</muted><highlight><y></highlight><muted>,</muted><highlight><z></highlight>"
      tp:
        done: "<success>Teleported to lobby spawn.</success>"
    config:
      usage: "<secondary>Usage:</secondary> <accent>/tea lobby config <show|manage-spawn|gamemode></accent>"
      show: "<primary><bold>Lobby config</bold></primary> <muted>|</muted> <secondary>manage-spawn:</secondary> <accent><manage-spawn></accent> <muted>|</muted> <secondary>gamemode:</secondary> <accent><gamemode></accent> <muted>|</muted> <secondary>spawn:</secondary> <highlight><spawn></highlight>"
      manage-spawn:
        usage: "<secondary>Usage:</secondary> <accent>/tea lobby config manage-spawn <true|false></accent>"
        done: "<success>manage-spawn is now</success> <accent><value></accent>"
      gamemode:
        usage: "<secondary>Usage:</secondary> <accent>/tea lobby config gamemode <survival|creative|adventure|spectator></accent>"
        invalid: "<error>Invalid gamemode </error><accent><value></accent><error>. Use one of: survival, creative, adventure, spectator.</error>"
        done: "<success>Lobby gamemode is now</success> <accent><mode></accent>"
